<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBB Model &mdash; Gameday</title>
<link rel="canonical" href="https://rkoren.com/cbb/">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/cbb-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/cbb-180.png">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<p class="nav"><a href="../">&laquo; rkoren</a></p>
<h1>CBB Model</h1>
<p class="sub">
  College basketball score predictions, scored against KenPom
</p>
<hr>

<div class="state" id="loading">Loading&hellip;</div>
<div class="state err" id="error" hidden></div>

<div id="content" hidden>
  <p id="seasonnote" class="sub"></p>

  <div class="controls">
    <label>Date
      <select id="date"></select>
    </label>
    <button id="prev" type="button">&laquo; prev</button>
    <button id="next" type="button">next &raquo;</button>
    <label>Show
      <select id="gender">
        <option value="">All</option>
        <option value="M">Men</option>
        <option value="W">Women</option>
      </select>
    </label>
    <label><input type="checkbox" id="kponly"> KenPom-covered only</label>
    <span class="muted" id="count"></span>
  </div>

  <table id="board">
    <thead>
      <tr>
        <th data-key="matchup">Matchup</th>
        <th class="nosort">Gd</th>
        <th class="num nosort">Our score</th>
        <th class="num" data-key="ourMargin">Our line</th>
        <th class="num" data-key="kpMargin">KenPom</th>
        <th class="num" data-key="gapMargin">Gap</th>
        <th class="num" data-key="ourProb">P(win)</th>
        <th class="num nosort">Final</th>
        <th class="nosort">Call</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <h2>Season accuracy vs KenPom</h2>
  <p class="sub" id="metricsnote"></p>
  <div id="metrics"></div>

  <p class="stale" id="updated"></p>
</div>

<hr>

<script src="../lib.js"></script>
<script src="./app.js"></script>

</body>
</html>
