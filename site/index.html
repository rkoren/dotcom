<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rkoren</title>
<link rel="canonical" href="https://rkoren.com/">
<link rel="icon" type="image/png" sizes="64x64" href="./assets/me-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/me-180.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<h1>rkoren</h1>
<hr>

<h2>Sports Trackers</h2>
<ul>
  <li>
    <a href="./dimaggio/">DiMaggio Watch</a> &mdash;
    tracking longest active MLB hitting streaks
    <span class="stale" id="st-dimaggio"></span>
  </li>
  <li>
    <a href="./cbb/">CBB Model</a> &mdash;
    college basketball score predictions compared to Kenpom
    <span class="stale" id="st-cbb"></span>
  </li>
  <li>
    <a href="./v2f/">Vegas to Fantasy</a> &mdash;
    fantasy football projections based on FD + DK player props
    <span class="stale" id="st-v2f"></span>
  </li>
</ul>

<hr>

<script src="./lib.js"></script>
<script>
(function () {
  var SOURCES = [
    { id: "st-dimaggio", url: "https://dimaggio-watch-data-674325521451.s3.us-east-1.amazonaws.com/streaks.json" },
    { id: "st-cbb", url: "https://reilly-cbb-model-data.s3.us-east-1.amazonaws.com/public/latest.json" },
    { id: "st-v2f", url: "https://v2f-674325521451-us-east-1-an.s3.us-east-1.amazonaws.com/v2f/public/latest.json" }
  ];
  SOURCES.forEach(function (s) {
    var node = el(s.id);
    if (!node) return;
    if (s.pending) {
      node.innerHTML = '<span class="muted">&mdash; ' + s.pending + "</span>";
      return;
    }
    fetchJSON(s.url)
      .then(function (d) { node.textContent = "\u2014 " + agoText(d.generatedAt); })
      .catch(function () { node.innerHTML = '<span class="err">&mdash; offline</span>'; });
  });
})();
</script>

</body>
</html>
